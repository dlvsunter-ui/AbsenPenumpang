<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Absensi Penumpang</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-top: 0; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    button { padding: 10px 18px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background-color: #2c3e50; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .loading { text-align: center; font-weight: bold; color: #7f8c8d; padding: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Dashboard Absensi Penumpang</h2>

    <div class="actions">
      <span>Data Rekap Realtime</span>
      <button onclick="loadData()">🔄 Refresh Data</button>
    </div>

    <div id="loading" class="loading">Memuat data dari Google Sheet...</div>

    <table id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>PIC</th>
          <th>Rute</th>
          <th>Jumlah</th>
          <th>Catatan</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // Link Web App Google Apps Script Anda
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbze816p-ETbtUBvF1jiUpNGlVCbZkf5P-9p0IWn_uZILL6x1mam7C7_Ci0-uXG-U_qx/exec";

    function loadData() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('dataTable');
      const tableBody = document.getElementById('tableBody');

      loading.style.display = 'block';
      table.style.display = 'none';
      tableBody.innerHTML = '';

      fetch(GOOGLE_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          loading.style.display = 'none';
          table.style.display = 'table';

          if (data && data.length > 0) {
            data.reverse().forEach(row => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${row.tanggal || '-'}</td>
                <td>${row.pic || '-'}</td>
                <td>${row.rute || '-'}</td>
                <td><strong>${row.jumlah || 0}</strong></td>
                <td>${row.catatan || '-'}</td>
              `;
              tableBody.appendChild(tr);
            });
          } else {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data absensi.</td></tr>';
          }
        })
        .catch(err => {
          loading.innerText = "Gagal mengambil data. Pastikan Web App disetting 'Anyone'.";
          console.error(err);
        });
    }

    // Load data otomatis saat dibuka
    loadData();
  </script>

</body>
</html>
