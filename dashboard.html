<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Monitoring Absensi Bus</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

  <div class="max-w-5xl mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-gray-800">📊 Dashboard Monitoring Absensi</h1>
        <p class="text-xs text-gray-500">Urutan: Data Terbaru & Nama (A-Z)</p>
      </div>
      <div class="flex gap-2">
        <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-2 rounded-lg border">
          ← Kembali ke Form
        </a>
        <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow">
          🔄 Refresh Data
        </button>
      </div>
    </div>

    <!-- Status Loading / Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div id="loading" class="p-8 text-center text-gray-500 text-sm font-semibold">
        ⏳ Memuat data absensi terbaru...
      </div>

      <div class="overflow-x-auto">
        <table id="dataTable" class="w-full text-left border-collapse text-xs hidden">
          <thead>
            <tr class="bg-blue-900 text-white">
              <th class="p-3">Waktu Input</th>
              <th class="p-3">Bus</th>
              <th class="p-3">Lokasi Check-in</th>
              <th class="p-3">Nama Penumpang (A-Z)</th>
              <th class="p-3">Divisi</th>
              <th class="p-3 text-center">Status</th>
              <th class="p-3">Remark</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-700"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Link Web App Google Apps Script Terbaru
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8iIM6KMiNSlcqXsw9j5h3VTmrkx1Y-u_2VwNyIVtlryyF8wCysxvTniNr3sETahik/exec";

    function loadData() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('dataTable');
      const tableBody = document.getElementById('tableBody');

      loading.classList.remove('hidden');
      table.classList.add('hidden');
      tableBody.innerHTML = '';

      fetch(GOOGLE_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          loading.classList.add('hidden');
          table.classList.remove('hidden');

          if (Array.isArray(data) && data.length > 0) {
            
            data.sort((a, b) => {
              const timeA = new Date(a.timestamp || 0).getTime();
              const timeB = new Date(b.timestamp || 0).getTime();

              if (timeB !== timeA) {
                return timeB - timeA;
              }
              
              const nameA = (a.nama || "").toLowerCase();
              const nameB = (b.nama || "").toLowerCase();
              return nameA.localeCompare(nameB);
            });

            data.forEach(row => {
              const tr = document.createElement('tr');
              tr.className = "hover:bg-gray-50";

              const isHadir = row.status === 'Hadir';
              const statusBadge = isHadir 
                ? `<span class="bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded text-[10px]">Hadir</span>`
                : `<span class="bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded text-[10px]">Tidak Hadir</span>`;

              tr.innerHTML = `
                <td class="p-3 whitespace-nowrap text-gray-500 font-mono">${row.timestamp || '-'}</td>
                <td class="p-3 font-semibold whitespace-nowrap">${row.bus || '-'}</td>
                <td class="p-3 text-blue-700 font-medium whitespace-nowrap">${row.lokasi || '-'}</td>
                <td class="p-3 font-bold text-gray-800 whitespace-nowrap">${row.nama || '-'}</td>
                <td class="p-3 text-gray-500 whitespace-nowrap">${row.divisi || '-'}</td>
                <td class="p-3 text-center whitespace-nowrap">${statusBadge}</td>
                <td class="p-3 text-gray-600">${row.remark || '-'}</td>
              `;
              tableBody.appendChild(tr);
            });

          } else {
            tableBody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">Belum ada data absensi yang masuk.</td></tr>`;
          }
        })
        .catch(err => {
          loading.innerHTML = `<span class="text-red-500 font-bold">Gagal mengambil data. Pastikan koneksi internet stabil.</span>`;
          console.error(err);
        });
    }

    window.onload = loadData;
  </script>
</body>
</html>
