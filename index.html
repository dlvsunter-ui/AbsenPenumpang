<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absen Penumpang</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; font-size: 14px; color: #34495e; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { border-color: #3498db; outline: none; }
    button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #27ae60; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .alert { padding: 10px; border-radius: 6px; font-size: 14px; margin-top: 15px; display: none; text-align: center; }
    .alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Form Absensi Penumpang</h2>
    <form id="absenForm">
      <div class="form-group">
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal" required />
      </div>

      <div class="form-group">
        <label for="pic">Nama PIC Hub:</label>
        <input type="text" id="pic" placeholder="Masukkan nama PIC" required />
      </div>

      <div class="form-group">
        <label for="rute">Rute Armada:</label>
        <select id="rute" required>
          <option value="">-- Pilih Rute --</option>
          <option value="Sunter - Karawang">Sunter - Karawang</option>
          <option value="Sunter - Cibitung">Sunter - Cibitung</option>
          <option value="Sunter - Pegangsaan">Sunter - Pegangsaan</option>
        </select>
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah Penumpang:</label>
        <input type="number" id="jumlah" min="1" placeholder="0" required />
      </div>

      <div class="form-group">
        <label for="catatan">Catatan / Keterangan:</label>
        <textarea id="catatan" rows="3" placeholder="Contoh: Terlambat 10 menit, rute lancar..."></textarea>
      </div>

      <button type="submit" id="btnSubmit">Kirim Ke Google Sheet</button>
    </form>

    <div id="statusAlert" class="alert"></div>
  </div>

  <script>
    // Link Web App Google Apps Script Anda
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbze816p-ETbtUBvF1jiUpNGlVCbZkf5P-9p0IWn_uZILL6x1mam7C7_Ci0-uXG-U_qx/exec";

    // Set tanggal default ke hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    const form = document.getElementById('absenForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusAlert = document.getElementById('statusAlert');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Mengirim...";
      statusAlert.style.display = 'none';

      const payload = {
        tanggal: document.getElementById('tanggal').value,
        pic: document.getElementById('pic').value,
        rute: document.getElementById('rute').value,
        jumlah: document.getElementById('jumlah').value,
        catatan: document.getElementById('catatan').value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusAlert.className = "alert success";
        statusAlert.innerText = "Data absensi berhasil dikirim!";
        statusAlert.style.display = 'block';
        form.reset();
        document.getElementById('tanggal').valueAsDate = new Date();
      })
      .catch(error => {
        statusAlert.className = "alert error";
        statusAlert.innerText = "Gagal mengirim data. Silakan coba lagi.";
        statusAlert.style.display = 'block';
        console.error('Error:', error);
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Kirim Ke Google Sheet";
      });
    });
  </script>

</body>
</html>
